# Ports được chọn để không đụng stack agentx đang chạy (5433, 6379).
# name: riêng, vì project mặc định "infra" trùng với stack agentx cũ.
name: market_agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: market_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_agent_db
    ports:
      - "5434:5432"
    volumes:
      - market_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: market_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  market_pgdata:
