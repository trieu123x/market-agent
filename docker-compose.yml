# Clone về rồi chạy: docker compose up -d --build  → mở http://localhost:3010
# Chỉ hạ tầng cho chế độ dev: docker compose up -d postgres redis
# Ports được chọn để không đụng stack agentx đang chạy (5433, 6379).
name: market_agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: market_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_agent_db
    ports:
      - "5434:5432"
    volumes:
      - market_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: market_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  # --- App ---
  api:
    build: ./backend
    container_name: market_api
    env_file: &backend_env_file
      - backend/.env.example        # giá trị mặc định, để clone về chạy được ngay
      - path: backend/.env          # cấu hình thật (API key...), ghi đè mặc định
        required: false
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/market_agent_db
      REDIS_URL: redis://redis:6379/0
      TASK_BROKER: redis
      RATE_LIMIT_BACKEND: redis
      CORS_ORIGINS: '["http://localhost:3010"]'
    ports:
      - "8010:8000"
    volumes:
      - market_uploads:/app/storage/uploads
      - market_hf_cache:/app/.cache/huggingface  # model Cross-Encoder reranker, chỉ tải lần đầu
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: market_worker
    command: ["taskiq", "worker", "app.workers.broker:broker", "app.workers.tasks"]
    env_file: *backend_env_file
    environment: *backend_env
    volumes:
      - market_uploads:/app/storage/uploads
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8010
    container_name: market_web
    ports:
      - "3010:3010"
    depends_on:
      - api

volumes:
  market_pgdata:
  market_uploads:
  market_hf_cache:
